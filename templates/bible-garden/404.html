{% extends "base.html" %}
{% block main %}
    <section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-24 text-center">
        <div class="section-leaf mb-6"></div>
        <p class="text-gold-500 text-sm font-semibold tracking-widest mb-4">404</p>
        <h1 class="font-serif text-3xl sm:text-4xl font-bold text-white mb-4">{{ t.not_found.title }}</h1>
        <p class="text-gray-400 mb-10">{{ t.not_found.text }}</p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            {% for code, name, href in homes %}
            <a href="{{ href }}" hreflang="{{ code }}" class="btn-outline px-6 py-3 rounded-xl text-sm inline-flex items-center justify-center cursor-pointer">{{ name }}</a>
            {% endfor %}
        </div>
    </section>
{% endblock %}
