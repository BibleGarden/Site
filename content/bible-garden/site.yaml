name: Bible Garden
base_url: https://bible.garden
output_dir: .
languages: [en, ru, uk]
default_language: en
language_labels: {en: EN, ru: RU, uk: UA}
logo: /img/logo.png
storage_key: bg-lang
# Landing pages link here; generated pages (articles, /about/, 404) use the campaign link below.
app_store_url: https://apps.apple.com/app/bible-garden/id6758955373
# App Store campaign per page language: ct=seo-en, seo-ru, seo-uk. See README, "App Store links".
article_app_store_url: https://apps.apple.com/app/apple-store/id6758955373?pt=119043617&ct=seo-{lang}&mt=8
# Byline and JSON-LD author of every article; `page` is a page of this site relative to the language root.
author:
  name: {en: Bible Garden team, ru: Команда Bible Garden, uk: Команда Bible Garden}
  page: about/
github_url: https://github.com/BibleGarden/
telegram_url: https://t.me/Mandarinka4
# Source directories and the Lampada checkout are served by the same nginx root.
robots_disallow:
  - /content/
  - /templates/
  - /sitegen/
  - /docs/
  - /lampada/
# Umami at stats.bible.garden: `none`, or {script_url, website_id}. See README, "Analytics".
analytics:
  script_url: https://stats.bible.garden/script.js
  website_id: 492eb2a8-fa4c-4d86-90c8-568f53fbccd4
