meta:
  language_name: Українська
  title: "Bible Garden — Слухайте Біблію кількома мовами"
  description: "Безкоштовний застосунок із відкритим кодом для читання та прослуховування Біблії з професійною озвучкою, налаштовуваними паузами та багатомовним відтворенням вірш за віршем."
  og_description: "Безкоштовний iOS-застосунок із відкритим кодом для багатомовного читання Біблії з аудіо."
