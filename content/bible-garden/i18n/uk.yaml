    title1: Слухайте Біблію
    title2: кількома мовами
    description: "Безкоштовний додаток для читання та прослуховування Біблії з професійною озвучкою, налаштовуваними паузами та унікальним багатомовним відтворенням вірш за віршем."
    appstore: App Store
    github: GitHub
  features:
    title: Як це працює
    subtitle: "Унікальний підхід до читання Біблії, що допомагає зануритися в Писання через різні мови та переклади."
    multi:
      badge: Головна фіча
      title: Мульти-читання
      desc: "Слухайте кожен вірш кількома мовами послідовно. Створіть свій пайплайн читання з будь-якою комбінацією перекладів та пауз."
      p1: "Вірш за віршем на 2+ мовах"
      p2: "Свій пайплайн: переклади + паузи"
      p3: "За віршем, абзацом або розділом"
    classic:
      title: Класичне читання
      desc: "Читайте та слухайте будь-яку книгу однією мовою з професійною озвучкою. Налаштовувані паузи між віршами, абзацами чи розділами для вдумливого читання."
      p1: Професійні диктори
      p2: "Паузи: за часом, повна зупинка"
      p3: Підсвітка слів Ісуса
    progress:
      title: Прогрес читання
      desc: "Візуальний прогрес для кожної книги Біблії. Додаток автоматично відстежує прослухане, прокручене або позначене вручну."
      p1: Прогрес-бар по розділах кожної книги
      p2: Авто-трекінг за аудіо та скролом
      p3: Загальний відсоток прочитання Біблії
  opensource:
    title: "Open Source\nза переконанням"
    desc: "Код Bible Garden відкритий під ліцензією GPL-3.0: застосунок і сервер — на GitHub. Ми віримо, що інструменти для читання Писання мають бути безкоштовними, прозорими та керованими спільнотою."
    point1: "iOS-додаток, API та адмін-панель — все відкрито"
    point2: "Ліцензія GPL-3.0 — вільно використовувати, змінювати та поширювати на тих самих умовах"
    point3: "Доступ до API — за ключем застосунку"
    cta: Дивитися на GitHub
    allrights: Усі права належать Богу.
  mission:
    title: Наша місія
    quote: "«Створити простір, де безкоштовно створюються та надаються усім бажаючим текстові та аудіо-версії Біблії різними мовами, у зручному форматі.»"
    p1:
      title: Все безкоштовно
      desc: "«Дарма отримали — дарма давайте.» Ми не приймаємо навіть донати."
    p2:
      title: Спільнота
      desc: "Будь-хто може додати переклад, голосувати за найкращий варіант та спільно покращувати якість."
    p3:
      title: Юридична чистота
      desc: "Тільки тексти та озвучки з ясним правовим статусом. Усі авторські права належать Богу."
  contact:
    title: "Зв'язатися з нами"
    desc: "Маєте питання, хочете допомогти проекту або просто привітатися? Напишіть нам."
    telegram: Телеграм
  footer:
    copyright: "Проєкт з відкритим кодом під ліцензією GPL-3.0. Усі права належать Богу."
    privacy: Політика конфіденційності
    about: Як ми пишемо
    rights_holders: Правовласникам

