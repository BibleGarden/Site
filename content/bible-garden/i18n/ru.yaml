    description: "Бесплатное приложение для чтения и прослушивания Библии с профессиональной озвучкой, настраиваемыми паузами и уникальным мультиязычным воспроизведением стих за стихом."
    appstore: App Store
    github: GitHub
  features:
    title: Как это работает
    subtitle: "Уникальный подход к чтению Библии, который помогает погрузиться в Писание через разные языки и переводы."
    multi:
      badge: Главная фича
      title: Мульти-чтение
      desc: "Слушайте каждый стих на нескольких языках последовательно. Создайте свой пайплайн чтения с любой комбинацией переводов и пауз."
      p1: "Стих за стихом на 2+ языках"
      p2: "Свой пайплайн: переводы + паузы"
      p3: "По стиху, абзацу или главе"
    classic:
      title: Классическое чтение
      desc: "Читайте и слушайте любую книгу на одном языке с профессиональной озвучкой. Настраиваемые паузы между стихами, абзацами или разделами для вдумчивого чтения."
      p1: Профессиональные дикторы
      p2: "Паузы: по времени, полная остановка"
      p3: Подсветка слов Иисуса
    progress:
      title: Прогресс чтения
      desc: "Визуальный прогресс для каждой книги Библии. Приложение автоматически отслеживает прослушанное, прокрученное или отмеченное вручную."
      p1: Прогресс-бар по главам каждой книги
      p2: Авто-трекинг по аудио и скроллу
      p3: Общий процент прочтения Библии
  opensource:
    title: "Open Source\nпо убеждению"
    desc: "Bible Garden полностью открыт под лицензией AGPL. Весь код доступен на GitHub. Мы верим, что инструменты для чтения Писания должны быть бесплатными, прозрачными и управляемыми сообществом."
    point1: "iOS-приложение, API и админ-панель — всё открыто"
    point2: "Лицензия AGPL — свободно использовать, изменять и распространять"
    point3: "API доступен для любых приложений, включая коммерческие"
    cta: Смотреть на GitHub
    allrights: Все права принадлежат Богу.
  mission:
    title: Наша миссия
    quote: "«Создать пространство, где бесплатно создаются и предоставляются всем желающим текстовые и аудио-версии Библии на разных языках, в удобном формате.»"
    p1:
      title: Всё бесплатно
      desc: "«Даром получили — даром давайте.» Мы не принимаем даже донаты."
    p2:
      title: Сообщество
      desc: "Любой может добавить перевод, голосовать за лучший вариант и совместно улучшать качество."
    p3:
      title: Юридическая чистота
      desc: "Только тексты и озвучки с ясным правовым статусом. Все авторские права принадлежат Богу."
  contact:
    title: Связаться с нами
