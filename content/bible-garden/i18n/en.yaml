meta:
  language_name: English
  title: "Bible Garden — Listen to the Bible in Multiple Languages"
  description: "Free, open-source app for reading and listening to the Bible with professional narration, configurable pauses, and verse-by-verse multilingual playback."
  og_description: "Free, open-source iOS app for multilingual Bible reading with audio."
landing:
  articles:
    all: All articles
  nav:
    features: Features
    opensource: Open Source
    mission: Mission
    contact: Contact
  hero:
    badge: "Open Source & Free Forever"
    title1: Listen to the Bible
    title2: in Multiple Languages
    description: "Free app for reading and listening to the Bible with professional narration, configurable pauses, and unique verse-by-verse multilingual playback."
    appstore: App Store
    github: GitHub
  features:
    title: How It Works
    subtitle: "A unique approach to Bible reading that helps you immerse in Scripture across languages and translations."
    multi:
      badge: Killer Feature
      title: Multi Reading
      desc: "Listen to each verse in multiple languages sequentially. Build your own reading pipeline with any combination of translations and pauses."
      p1: "Verse-by-verse in 2+ languages"
      p2: "Custom pipeline: translations + pauses"
      p3: "Read by verse, paragraph, or chapter"
    classic:
      title: Classic Reading
      desc: "Read and listen to any book in one language with professional narration. Configurable pauses between verses, paragraphs, or sections for contemplative reading."
      p1: Professional narrators per language
      p2: "Pauses: timed, full stop, or none"
      p3: Words of Jesus highlighted
    progress:
      title: Reading Progress
      desc: "Visual progress for every book of the Bible. The app automatically tracks what you've listened to, scrolled through, or marked manually."
      p1: Per-book chapter progress bars
      p2: "Auto-tracking by audio & scrolling"
      p3: Total Bible reading percentage
  opensource:
    title: "Open Source\nby Design"
    desc: "Bible Garden is open source under the GPL-3.0 license: the app and server code is on GitHub. We believe that tools for reading Scripture should be free, transparent, and community-driven."
    point1: "iOS app, API, and admin tools — all open source"
    point2: "GPL-3.0 — free to use, modify, and share under the same terms"
    point3: "API access by application key"
    cta: Explore on GitHub
    allrights: All rights belong to God.
  mission:
    title: Our Mission
    quote: "\"Create a space where free text and audio versions of the Bible are created and made available to everyone, in multiple languages, in a convenient format.\""
    p1:
      title: Free Forever
      desc: "\"Freely you have received; freely give.\" We don't even accept donations."
    p2:
      title: Community Driven
      desc: "Anyone can contribute translations, vote for the best options, and improve quality together."
    p3:
      title: Legally Clear
      desc: "Only texts and audio with clear legal status. All copyrights belong to God."
  contact:
    title: Get in Touch
    desc: "Have questions, want to contribute, or just say hello? Reach out through any of these channels."
    telegram: Telegram
  footer:
    copyright: "Open source project under the GPL-3.0 license. All rights belong to God."
    privacy: Privacy Policy
    about: How we write
    rights_holders: For rights holders
