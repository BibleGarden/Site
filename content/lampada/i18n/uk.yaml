    title: "Застосунок не дає відповідей — він ставить запитання"
  screens:
    home: "Головний екран Lampada: лампада й позначки молитов за тиждень"
    topic: "Екран перед молитвою: тема і тривалість"
    question: "Молитва з таймером і навідним запитанням"
    answer: "Відповідь на запитання текстом"
    audio: "Запис голосової відповіді"
    passage: "Уривок Писання під час молитви"
    reflection: "Завершальне запитання наприкінці молитви"
    history: "Щоденник молитов із пошуком"
  steps:
    home:
      title: "Вогник на кожен день"
      text: "Лампада на головному екрані горить яскравіше в ті дні, коли ти молишся. Сім крапок показують останні сім днів — тихе нагадування, а не змагання."
    topic:
      title: "Обери тему і час"
      text: "Напиши, з чим приходиш до Бога, або почни вільну молитву. Обери 5, 15 чи 30 хвилин, годину, задай свій час або молися без таймера."
    question:
      title: "Запитання, що ведуть глибше"
      text: "Під час молитви Lampada ставить запитання за твоєю темою — їх складає ШІ. Це лише підказки — будь-яке з них можна пропустити."
    answer:
      title: "Відповідай своїми словами"
      text: "Напиши відповідь на запитання — вона збережеться в щоденнику. Якщо дозволиш, відповіді надійдуть на сервер, і ШІ поставить наступне запитання й добере Писання з їх урахуванням."
    audio:
      title: "Або скажи вголос"
      text: "Якщо не хочеться писати, запиши відповідь голосом. Запис можна перетворити на текст одним дотиком."
    passage:
      title: "Писання за змістом молитви"
      text: "Lampada добирає уривки Писання за змістом твоєї теми та відповідей. Їх можна послухати й зберегти в обране."
    reflection:
      title: "Підсумок наприкінці"
      text: "Наостанок Lampada ставить одне запитання. Запиши рядок-другий, який хочеш забрати із собою, — він збережеться разом із молитвою."
    history:
      title: "Щоденник твоїх молитов"
      text: "Молитви зберігаються в щоденнику: тема, відповіді, записи й збережені уривки. Щоденник лишається на твоєму пристрої, і в ньому можна шукати."
  extras:
    title: "Ще в Lampada"
    music:
      title: "Тиха музика"
      text: "П’ятнадцять спокійних мелодій для молитви. Вмикаються одним дотиком і звучать навіть без інтернету."
    reminders:
      title: "Нагадування"
      text: "Обери, о котрій Lampada лагідно нагадає про молитву."
    pin:
      title: "Пін-код і Face ID"
      text: "Захисти застосунок пін-кодом. Код ніде не зберігається, тому знаєш його лише ти."
    share:
      title: "Поділитися молитвою"
      text: "Надішли молитву зі щоденника текстом: тему, відповіді й вибрані уривки."
  footer:
    bible_garden: Bible Garden
