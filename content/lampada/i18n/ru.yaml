  steps:
    home:
      title: "Огонёк на каждый день"
      text: "Лампада на главном экране горит ярче в те дни, когда ты молишься. Семь точек показывают последние семь дней — тихое напоминание, а не соревнование."
    topic:
      title: "Выбери тему и время"
      text: "Напиши, с чем приходишь к Богу, или начни свободную молитву. Выбери 5, 15 или 30 минут, час, задай своё время или молись без таймера."
    question:
      title: "Вопросы, которые ведут глубже"
      text: "Во время молитвы Lampada задаёт вопросы по твоей теме — их составляет ИИ. Это лишь подсказки — любой из них можно пропустить."
    answer:
      title: "Отвечай своими словами"
      text: "Напиши ответ на вопрос — он сохранится в дневнике. Если разрешишь, ответы уйдут на сервер, и ИИ задаст следующий вопрос и подберёт Писание с их учётом."
    audio:
      title: "Или скажи вслух"
      text: "Если не хочется писать, запиши ответ голосом. Запись можно превратить в текст одним нажатием."
    passage:
      title: "Писание по смыслу молитвы"
      text: "Lampada подбирает отрывки Писания по смыслу твоей темы и ответов. Их можно послушать и сохранить в избранное."
    reflection:
      title: "Итог в конце"
      text: "Напоследок Lampada задаёт один вопрос. Запиши строчку-другую, которую хочешь унести с собой, — она сохранится вместе с молитвой."
    history:
      title: "Дневник твоих молитв"
      text: "Молитвы хранятся в дневнике: тема, ответы, записи и сохранённые отрывки. Дневник остаётся на твоём устройстве, и по нему можно искать."
  extras:
    title: "Ещё в Lampada"
    music:
      title: "Тихая музыка"
      text: "Пятнадцать спокойных мелодий для молитвы. Включаются одним нажатием и звучат даже без интернета."
    reminders:
      title: "Напоминания"
      text: "Выбери, в какое время Lampada мягко напомнит о молитве."
    pin:
      title: "Пин-код и Face ID"
      text: "Закрой приложение пин-кодом. Сам код не хранится, поэтому знаешь его только ты."
    share:
      title: "Поделиться молитвой"
      text: "Отправь молитву из дневника текстом: тему, ответы и избранные отрывки."
  privacy_note:
    title: "Твоя молитва остаётся твоей"
    lead: "Мы очень серьёзно относимся к конфиденциальности."
    points:
      device: "Молитвы, ответы и записи хранятся на твоём устройстве."
      ai: "ИИ работает только с твоего разрешения — отдельно для каждой функции. Без него тоже можно молиться."
      server: "Разрешённый текст обрабатывают наш сервер и Google Gemini. Архива молитв на нашем сервере нет."
      tracking: "В приложении нет рекламы, SDK аналитики, трекеров и профилей. Наш сервер хранит техническую статистику запросов. Сам пин-код не хранится и никуда не передаётся."
    link: "Политика конфиденциальности"
