    topic: "Экран перед молитвой: тема и длительность"
    question: "Молитва с таймером и наводящим вопросом"
    answer: "Ответ на вопрос текстом"
    audio: "Запись голосового ответа"
    passage: "Отрывок Писания во время молитвы"
    reflection: "Завершающий вопрос в конце молитвы"
