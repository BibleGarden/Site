  purpose:
    title: Мягкий ритм, а не ещё одна задача
    text: Lampada сопровождает личную христианскую молитву от первого намерения до завершающего размышления. Она поддерживает
      внимание, не подменяя твои собственные слова.
    f1:
      title: Молись осознанно
      text: Задай тему и удобную длительность. Направляющие вопросы помогают оставаться в моменте и идти глубже.
    f2:
      title: Встречай Писание в контексте
      text: Lampada подбирает отрывки Писания по смыслу, чтобы чтение отзывалось на молитву, которой ты живёшь сегодня.
    f3:
      title: Возвращайся к главному
      text: Сохраняй текстовые или голосовые размышления, итог молитвы и избранные стихи в личном дневнике на устройстве.
  quiet:
    text: 'Тёплое пространство без лишнего шума: спокойная музыка, таймер молитвы и мягкие напоминания вернуться.'
    label: Создано для тишины
