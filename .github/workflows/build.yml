name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Keep the legacy public tree unchanged until nginx switches
        run: |
          git diff --exit-code 95e0889 -- \
            404.html index.html robots.txt sitemap.xml llms.txt \
            about articles ru uk privacy.html css js img lampada

      - name: Rebuild the site
        run: python -m sitegen build

      - name: Committed public dist must match the build output
        run: |
          git add -A
          git diff --cached --stat --exit-code

      - name: Validate public files and references
        run: python -m sitegen check

      - name: Test article screenshots
        run: python -m unittest discover -s tests
